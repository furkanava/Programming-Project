<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Rzeszow Event Planner</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #f425af;
            --bg-dark: #22101c;
            --card-dark: #2f1d28;
            --input-dark: #392330;
            --border-dark: #543b4c;
            --text-secondary: #ba9cb0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans', sans-serif;
            background: linear-gradient(135deg, #22101c 0%, #2f1d28 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .admin-login-card {
            background: var(--card-dark);
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-dark);
        }
        
        .admin-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .admin-logo .icon {
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        
        .admin-logo .icon .material-symbols-outlined {
            font-size: 48px;
            color: white;
        }
        
        .admin-logo h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .admin-logo p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .form-label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .form-control {
            background: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
        }
        
        .form-control:focus {
            background: var(--input-dark);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 0 0 3px rgba(244, 37, 175, 0.1);
        }
        
        .form-control::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }
        
        .btn-admin {
            background: var(--primary);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s;
        }
        
        .btn-admin:hover {
            background: #d41d9a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 37, 175, 0.3);
        }
        
        .btn-admin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            padding: 12px 16px;
            margin-bottom: 20px;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .back-link a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="admin-login-card">
        <div class="admin-logo">
            <div class="icon">
                <span class="material-symbols-outlined">admin_panel_settings</span>
            </div>
            <h1>Admin Panel</h1>
            <p>Event Management System</p>
        </div>
        
        <div id="alertContainer"></div>
        
        <form id="adminLoginForm">
            <div class="mb-4">
                <label for="adminUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="adminUsername" placeholder="Enter admin username" required autocomplete="username">
            </div>
            
            <div class="mb-4">
                <label for="adminPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="adminPassword" placeholder="Enter admin password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-admin" id="adminLoginBtn">
                <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 8px;">login</span>
                Login as Admin
            </button>
        </form>
        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>
    
    <script>
        // Admin credentials (in production, this should be stored securely)
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'admin';
        
        // Check if already logged in as admin
        const adminSession = sessionStorage.getItem('adminLoggedIn');
        if (adminSession === 'true') {
            window.location.href = 'admin.html';
        }
        
        // Admin login form handler
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;
            const loginBtn = document.getElementById('adminLoginBtn');
            const alertContainer = document.getElementById('alertContainer');
            const originalText = loginBtn.innerHTML;
            
            // Clear previous alerts
            alertContainer.innerHTML = '';
            
            // Validate credentials
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';
                
                // Set admin session
                sessionStorage.setItem('adminLoggedIn', 'true');
                
                // Redirect to admin panel
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 500);
            } else {
                // Show error
                alertContainer.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 8px;">error</span>
                        Invalid username or password
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
