<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - Rzeszow Event Planner</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #f425af;
            --bg-dark: #22101c;
            --card-dark: #2f1d28;
            --input-dark: #392330;
            --border-dark: #543b4c;
            --text-secondary: #ba9cb0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans', sans-serif;
            background: linear-gradient(135deg, #22101c 0%, #2f1d28 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .verification-card {
            background: var(--card-dark);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-dark);
        }
        
        .verification-icon {
            width: 80px;
            height: 80px;
            background: rgba(244, 37, 175, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        
        .verification-icon .material-symbols-outlined {
            font-size: 48px;
            color: var(--primary);
        }
        
        .verification-card h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
        }
        
        .verification-card p {
            color: var(--text-secondary);
            font-size: 15px;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .email-display {
            background: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 24px;
        }
        
        .email-display strong {
            color: white;
            font-size: 16px;
        }
        
        .btn-verify {
            background: var(--primary);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s;
            margin-bottom: 16px;
        }
        
        .btn-verify:hover {
            background: #d41d9a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 37, 175, 0.3);
        }
        
        .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-resend {
            background: transparent;
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
            width: 100%;
            transition: all 0.3s;
        }
        
        .btn-resend:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            padding: 12px 16px;
            margin-bottom: 20px;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .back-link a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="verification-card">
        <div class="verification-icon">
            <span class="material-symbols-outlined">mail</span>
        </div>
        
        <h1>Verify Your Email</h1>
        <p>We've sent a verification link to your email address. Please check your inbox and click the link to verify your account.</p>
        
        <div class="email-display">
            <strong id="userEmail">Loading...</strong>
        </div>
        
        <div id="alertContainer"></div>
        
        <button class="btn btn-verify" id="checkVerificationBtn">
            <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 8px;">check_circle</span>
            I've Verified My Email
        </button>
        
        <button class="btn btn-resend" id="resendEmailBtn">
            <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 8px; font-size: 18px;">refresh</span>
            Resend Verification Email
        </button>
        
        <div class="back-link">
            <a href="signin.html">← Back to Sign In</a>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>
    
    <!-- Firebase Functions -->
    <script src="js/auth.js"></script>
    
    <script>
        let checkInterval = null;
        
        // Get email from URL or session
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || sessionStorage.getItem('pendingVerificationEmail');
        
        if (email) {
            document.getElementById('userEmail').textContent = email;
            sessionStorage.setItem('pendingVerificationEmail', email);
        } else {
            // Try to get from current user
            if (window.firebaseAuth) {
                window.firebaseAuth.onAuthStateChanged((user) => {
                    if (user && user.email) {
                        document.getElementById('userEmail').textContent = user.email;
                        sessionStorage.setItem('pendingVerificationEmail', user.email);
                    } else {
                        window.location.href = 'signin.html';
                    }
                });
            }
        }
        
        // Check verification status
        async function checkVerification() {
            const checkBtn = document.getElementById('checkVerificationBtn');
            const alertContainer = document.getElementById('alertContainer');
            const originalText = checkBtn.innerHTML;
            
            checkBtn.disabled = true;
            checkBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Checking...';
            
            try {
                // Reload user to get latest verification status
                const user = window.firebaseAuth.currentUser;
                if (user) {
                    await user.reload();
                    
                    if (user.emailVerified) {
                        alertContainer.innerHTML = `
                            <div class="alert alert-success" role="alert">
                                <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 8px;">check_circle</span>
                                Email verified successfully! Redirecting...
                            </div>
                        `;
                        
                        // Clear pending verification
                        sessionStorage.removeItem('pendingVerificationEmail');
                        
                        // Stop checking interval
                        if (checkInterval) {
                            clearInterval(checkInterval);
                        }
                        
                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    } else {
                        alertContainer.innerHTML = `
                            <div class="alert alert-warning" role="alert">
                                <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 8px;">info</span>
                                Email not verified yet. Please check your inbox and click the verification link.
                            </div>
                        `;
                        checkBtn.disabled = false;
                        checkBtn.innerHTML = originalText;
                    }
                } else {
                    window.location.href = 'signin.html';
                }
            } catch (error) {
                console.error('Check verification error:', error);
                alertContainer.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 8px;">error</span>
                        Error checking verification: ${error.message}
                    </div>
                `;
                checkBtn.disabled = false;
                checkBtn.innerHTML = originalText;
            }
        }
        
        // Resend verification email
        async function resendVerificationEmail() {
            const resendBtn = document.getElementById('resendEmailBtn');
            const alertContainer = document.getElementById('alertContainer');
            const originalText = resendBtn.innerHTML;
            
            resendBtn.disabled = true;
            resendBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';
            
            try {
                const result = await window.sendEmailVerification();
                
                if (result && result.success) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success" role="alert">
                            <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 8px;">check_circle</span>
                            Verification email sent! Please check your inbox.
                        </div>
                    `;
                } else {
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 8px;">error</span>
                            ${result ? result.error : 'Failed to send verification email'}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Resend verification error:', error);
                alertContainer.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 8px;">error</span>
                        Error: ${error.message}
                    </div>
                `;
            } finally {
                resendBtn.disabled = false;
                resendBtn.innerHTML = originalText;
            }
        }
        
        // Event listeners
        document.getElementById('checkVerificationBtn').addEventListener('click', checkVerification);
        document.getElementById('resendEmailBtn').addEventListener('click', resendVerificationEmail);
        
        // Auto-check every 5 seconds
        if (window.firebaseAuth) {
            checkInterval = setInterval(() => {
                const user = window.firebaseAuth.currentUser;
                if (user && !user.emailVerified) {
                    user.reload().then(() => {
                        if (user.emailVerified) {
                            checkVerification();
                        }
                    }).catch(err => console.error('Auto-check error:', err));
                }
            }, 5000);
        }
    </script>
</body>
</html>
