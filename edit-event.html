<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event - Rzeszow Event Planner</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f425af;
            --background-dark: #22101c;
            --card-dark: #392833;
            --input-dark: #271b23;
            --border-dark: #543b4c;
        }
        
        body {
            font-family: 'Spline Sans', sans-serif;
            background-color: var(--background-dark);
            color: #fff;
            min-height: 100vh;
        }
        
        .navbar {
            background-color: rgba(34, 16, 28, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-dark);
        }
        
        .form-card {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 1.5rem;
            padding: 2rem;
        }
        
        .form-control, .form-select {
            background: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 0.75rem;
            color: #fff;
            padding: 12px 16px;
        }
        
        .form-control:focus, .form-select:focus {
            background: var(--input-dark);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(244, 37, 175, 0.25);
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .form-label {
            color: #fff;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .btn-primary-custom {
            background: var(--primary);
            border: none;
            border-radius: 50px;
            padding: 12px 32px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(244, 37, 175, 0.25);
        }
        
        .btn-primary-custom:hover {
            background: rgba(244, 37, 175, 0.9);
        }
        
        .image-upload-area {
            border: 2px dashed var(--border-dark);
            border-radius: 1rem;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .image-upload-area:hover {
            border-color: var(--primary);
            background: rgba(244, 37, 175, 0.05);
        }
        
        .current-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid px-4 px-md-5">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <div class="bg-primary bg-opacity-20 rounded-circle p-2">
                    <span class="material-symbols-outlined" style="color: var(--primary); font-size: 20px;">celebration</span>
                </div>
                <span class="fw-bold">Rzeszow Event Planner</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto me-4">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="all-events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="forum.html">Forum</a></li>
                </ul>
                <a href="dashboard.html" class="btn btn-outline-light btn-sm d-flex align-items-center gap-2" style="border-radius: 50px;">
                    <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
                    <span class="d-none d-md-inline">Back</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid px-4 px-md-5 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="mb-4">
                    <h1 class="display-4 fw-bold mb-2">Edit Event</h1>
                    <p class="text-white-50">Update your event details</p>
                </div>
                
                <form class="form-card" id="editEventForm">
                    <div class="row g-4">
                        <!-- Event Title -->
                        <div class="col-12">
                            <label for="eventTitle" class="form-label">Event Title *</label>
                            <input type="text" class="form-control" id="eventTitle" placeholder="e.g., Neon Rooftop Mixer" required>
                        </div>
                        
                        <!-- Description -->
                        <div class="col-12">
                            <label for="description" class="form-label">Description *</label>
                            <textarea class="form-control" id="description" rows="4" placeholder="Describe your event..." required></textarea>
                        </div>
                        
                        <!-- Date & Time -->
                        <div class="col-md-6">
                            <label for="eventDate" class="form-label">Date *</label>
                            <input type="date" class="form-control" id="eventDate" required>
                        </div>
                        <div class="col-md-3">
                            <label for="startTime" class="form-label">Start Time *</label>
                            <input type="time" class="form-control" id="startTime" required>
                        </div>
                        <div class="col-md-3">
                            <label for="endTime" class="form-label">End Time</label>
                            <input type="time" class="form-control" id="endTime">
                        </div>
                        
                        <!-- Location -->
                        <div class="col-md-8">
                            <label for="location" class="form-label">Location *</label>
                            <input type="text" class="form-control" id="location" placeholder="e.g., Grand Hotel Boutique, 3-go Maja 15" required>
                        </div>
                        <div class="col-md-4">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" value="Rzeszow" readonly>
                        </div>
                        
                        <!-- Price & Capacity -->
                        <div class="col-md-6">
                            <label for="price" class="form-label">Price (PLN)</label>
                            <input type="number" class="form-control" id="price" placeholder="0 for free" min="0" value="0">
                        </div>
                        <div class="col-md-6">
                            <label for="capacity" class="form-label">Max Capacity</label>
                            <input type="number" class="form-control" id="capacity" placeholder="Unlimited" min="1">
                        </div>
                        
                        <!-- Category -->
                        <div class="col-12">
                            <label for="category" class="form-label">Category *</label>
                            <select class="form-select" id="category" required>
                                <option value="">Select a category</option>
                                <option value="music">Music</option>
                                <option value="nightlife">Nightlife</option>
                                <option value="food">Food</option>
                                <option value="arts">Arts</option>
                                <option value="sports">Sports</option>
                                <option value="wellness">Wellness</option>
                                <option value="social">Social</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        
                        <!-- Image Upload -->
                        <div class="col-12">
                            <label class="form-label">Event Image</label>
                            <div id="currentImageContainer" style="display: none; margin-bottom: 1rem;">
                                <p class="text-white-50 small mb-2">Current Image:</p>
                                <img id="currentImage" class="current-image" alt="Current event image">
                            </div>
                            <div class="image-upload-area" id="imageUploadArea">
                                <span class="material-symbols-outlined mb-2" style="font-size: 48px; color: var(--primary);">image</span>
                                <p class="text-white mb-1" id="uploadText">Click to upload or drag and drop</p>
                                <p class="text-white-50 small mb-0">PNG, JPG up to 10MB</p>
                                <input type="file" id="eventImage" class="d-none" accept="image/*">
                            </div>
                        </div>
                        
                        <!-- Public/Private -->
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="isPublic" checked>
                                <label class="form-check-label text-white" for="isPublic">
                                    Make this event public
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Submit Buttons -->
                    <div class="d-flex gap-3 mt-5 pt-4 border-top border-border-dark">
                        <button type="submit" class="btn btn-primary-custom" id="updateEventBtn">
                            Update Event
                        </button>
                        <a href="dashboard.html" class="btn btn-outline-secondary" style="border-color: var(--border-dark); color: #fff; border-radius: 50px; padding: 12px 32px;">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>
    
    <!-- Firebase Functions -->
    <script src="auth.js"></script>
    <script src="events.js"></script>
    
    <script>
        // Get event ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id');
        let currentEvent = null;
        
        // Wait for Firebase to be fully loaded
        function waitForFirebase(callback, maxAttempts = 20) {
            let attempts = 0;
            const checkFirebase = setInterval(() => {
                attempts++;
                if (window.firebaseDb && window.getEventById && window.updateEvent && window.getCurrentUser) {
                    clearInterval(checkFirebase);
                    callback();
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkFirebase);
                    console.error('Firebase failed to load after', maxAttempts, 'attempts');
                    alert('Firebase is taking too long to load. Please refresh the page.');
                }
            }, 100);
        }
        
        waitForFirebase(() => {
            // Check authentication
            if (window.firebaseAuth) {
                window.firebaseAuth.onAuthStateChanged((user) => {
                    if (!user) {
                        window.location.href = 'signin.html';
                    } else if (eventId) {
                        loadEventData();
                    } else {
                        alert('Event ID not found');
                        window.location.href = 'dashboard.html';
                    }
                });
            }
            
            // Image upload functionality
            document.getElementById('imageUploadArea').addEventListener('click', function() {
                document.getElementById('eventImage').click();
            });
            
            document.getElementById('eventImage').addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    const fileName = e.target.files[0].name;
                    document.getElementById('uploadText').textContent = fileName;
                }
            });
            
            // Form submission
            document.getElementById('editEventForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const updateBtn = document.getElementById('updateEventBtn');
                const originalText = updateBtn.innerHTML;
                
                // Check if Firebase is loaded
                if (!window.firebaseDb || !window.updateEvent) {
                    alert('Firebase is not loaded. Please refresh the page and try again.');
                    return;
                }
                
                // Disable button and show loading
                updateBtn.disabled = true;
                updateBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating...';
                
                try {
                    // Get form values
                    const eventData = {
                        title: document.getElementById('eventTitle').value.trim(),
                        description: document.getElementById('description').value.trim(),
                        date: document.getElementById('eventDate').value,
                        startTime: document.getElementById('startTime').value,
                        endTime: document.getElementById('endTime').value || null,
                        location: document.getElementById('location').value.trim(),
                        city: document.getElementById('city').value.trim(),
                        price: parseFloat(document.getElementById('price').value) || 0,
                        capacity: document.getElementById('capacity').value ? parseInt(document.getElementById('capacity').value) : null,
                        category: document.getElementById('category').value,
                        isPublic: document.getElementById('isPublic').checked
                    };
                    
                    // Validate required fields
                    if (!eventData.title || !eventData.description || !eventData.date || !eventData.startTime || !eventData.location || !eventData.category) {
                        throw new Error('Please fill in all required fields');
                    }
                    
                    // Update event
                    const result = await window.updateEvent(eventId, eventData);
                    
                    if (result && result.success) {
                        // Upload new image if provided
                        const imageFile = document.getElementById('eventImage').files[0];
                        if (imageFile) {
                            updateBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing image...';
                            try {
                                const uploadResult = await window.uploadEventImage(eventId, imageFile);
                                if (uploadResult && uploadResult.success) {
                                    console.log('Image processed and saved successfully');
                                } else {
                                    console.error('Image processing failed:', uploadResult?.error);
                                    alert('Event updated but image processing failed: ' + (uploadResult?.error || 'Unknown error'));
                                }
                            } catch (err) {
                                console.error('Error processing image:', err);
                                alert('Event updated but image processing failed.');
                            }
                        }
                        
                        // Reset button
                        updateBtn.disabled = false;
                        updateBtn.innerHTML = originalText;
                        
                        alert('Event updated successfully!');
                        window.location.href = 'dashboard.html';
                    } else {
                        const errorMsg = result ? result.error : 'Unknown error occurred';
                        updateBtn.disabled = false;
                        updateBtn.innerHTML = originalText;
                        alert('Error: ' + errorMsg);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    updateBtn.disabled = false;
                    updateBtn.innerHTML = originalText;
                    alert('An error occurred: ' + (error.message || error));
                }
            });
        });
        
        // Load event data
        async function loadEventData() {
            if (!eventId) return;
            
            const result = await window.getEventById(eventId);
            if (result.success) {
                currentEvent = result.event;
                
                // Check if user owns the event
                const user = window.getCurrentUser();
                if (user && currentEvent.createdBy !== user.uid) {
                    alert('You are not authorized to edit this event');
                    window.location.href = 'dashboard.html';
                    return;
                }
                
                // Populate form
                document.getElementById('eventTitle').value = currentEvent.title || '';
                document.getElementById('description').value = currentEvent.description || '';
                
                // Date
                if (currentEvent.date) {
                    let dateStr = '';
                    if (currentEvent.dateString) {
                        dateStr = currentEvent.dateString;
                    } else if (currentEvent.date.toDate) {
                        const date = currentEvent.date.toDate();
                        dateStr = date.toISOString().split('T')[0];
                    } else if (currentEvent.date.seconds) {
                        const date = new Date(currentEvent.date.seconds * 1000);
                        dateStr = date.toISOString().split('T')[0];
                    }
                    document.getElementById('eventDate').value = dateStr;
                }
                
                document.getElementById('startTime').value = currentEvent.startTime || '';
                document.getElementById('endTime').value = currentEvent.endTime || '';
                document.getElementById('location').value = currentEvent.location || '';
                document.getElementById('city').value = currentEvent.city || 'Rzeszow';
                document.getElementById('price').value = currentEvent.price || 0;
                document.getElementById('capacity').value = currentEvent.capacity || '';
                document.getElementById('category').value = currentEvent.category || '';
                document.getElementById('isPublic').checked = currentEvent.isPublic !== false;
                
                // Show current image if exists
                // Check for image (base64 or URL)
                const imageUrl = currentEvent.imageURL || currentEvent.imageBase64;
                if (imageUrl) {
                    document.getElementById('currentImage').src = imageUrl;
                    document.getElementById('currentImageContainer').style.display = 'block';
                }
            } else {
                alert('Error loading event: ' + result.error);
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
